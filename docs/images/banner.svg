<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="55%" stop-color="#141a35"/>
      <stop offset="100%" stop-color="#1d1740"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a99dff"/>
      <stop offset="100%" stop-color="#7ee2a8"/>
    </linearGradient>
  </defs>
  <style>
    .tag   { fill: #c9d0e6; font-size: 15.5px }
    .meta  { fill: #7b86a8; font-size: 12px; letter-spacing: .09em }
    .chip  { fill: #1a2140; stroke: #333d68; stroke-width: 1 }
    .chipT { fill: #b8c1dc; font-size: 11.5px; font-weight: 600 }
  </style>

  <rect width="900" height="230" fill="url(#sky)" rx="14"/>

  <!-- a soft cloud, since the project is a private cloud -->
  <g opacity="0.13" fill="#a99dff">
    <ellipse cx="742" cy="86" rx="66" ry="40"/>
    <ellipse cx="800" cy="98" rx="52" ry="31"/>
    <ellipse cx="694" cy="104" rx="46" ry="28"/>
    <rect x="694" y="98" width="106" height="30" rx="15"/>
  </g>
  <g opacity="0.08" fill="#7ee2a8">
    <ellipse cx="640" cy="168" rx="44" ry="24"/>
    <ellipse cx="678" cy="176" rx="34" ry="19"/>
  </g>

  <text x="52" y="86" font-size="54" font-weight="800" fill="url(#ink)" letter-spacing="0.09em">STRATUS</text>
  <text x="55" y="120" class="tag">A private cloud you can hold in your hand.</text>
  <text x="55" y="144" class="tag">Chat, files and web hosting for one room — end-to-end encrypted, on your own machine.</text>

  <g transform="translate(55,168)">
    <rect class="chip" x="0"   y="0" width="118" height="26" rx="13"/>
    <text x="59"  y="17" class="chipT" text-anchor="middle">Linux only</text>
    <rect class="chip" x="128" y="0" width="150" height="26" rx="13"/>
    <text x="203" y="17" class="chipT" text-anchor="middle">End-to-end encrypted</text>
    <rect class="chip" x="288" y="0" width="132" height="26" rx="13"/>
    <text x="354" y="17" class="chipT" text-anchor="middle">2,455 lines Bash</text>
    <rect class="chip" x="430" y="0" width="112" height="26" rx="13"/>
    <text x="486" y="17" class="chipT" text-anchor="middle">194 tests</text>
  </g>

  <text x="55" y="216" class="meta">CSET-213 · LINUX &amp; SHELL PROGRAMMING · BENNETT UNIVERSITY</text>
</svg>
